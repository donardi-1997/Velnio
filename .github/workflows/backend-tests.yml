name: Backend Tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run backend tests
        env:
          AI_PROVIDER: mock
          SHOPIFY_MODE: mock
          BILLING_PROVIDER: mock
        run: pytest app/tests app/modules -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: velnio
          POSTGRES_PASSWORD: velnio
          POSTGRES_DB: velnio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velnio -d velnio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Upgrade empty PostgreSQL database to head
        run: alembic upgrade head

      - name: Verify ORM and migration schema are aligned
        run: alembic check

      - name: Verify migration downgrade and re-upgrade path
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Recheck schema after round trip
        run: alembic check
